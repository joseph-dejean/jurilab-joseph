steps:
  # Build the Docker image (React + FastAPI combined)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:latest'
      # Supabase public config (anon key is safe in browser — RLS enforces security)
      - '--build-arg'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'
      # Google APIs — browser keys (restrict by HTTP referrer in GCP Console)
      - '--build-arg'
      - 'VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}'
      - '--build-arg'
      - 'VITE_GOOGLE_DEVELOPER_KEY=${_VITE_GOOGLE_DEVELOPER_KEY}'
      - '--build-arg'
      - 'VITE_GOOGLE_APP_ID=${_VITE_GOOGLE_APP_ID}'
      # Third-party services
      - '--build-arg'
      - 'VITE_STREAM_API_KEY=${_VITE_STREAM_API_KEY}'
      # NOTE: VITE_GEMINI_API_KEY intentionally removed — Gemini uses ADC on the backend
      # NOTE: VITE_DAILY_API_KEY intentionally removed — Daily.co calls proxied through FastAPI backend
      - '.'

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:latest'

  # Deploy to Cloud Run
  # Cloud Run service account must have (run scripts/setup-gcp.sh once):
  #   - roles/aiplatform.user           (Vertex AI / Gemini via ADC)
  #   - roles/discoveryengine.viewer    (Vertex AI Search via ADC)
  #   - roles/secretmanager.secretAccessor  (read secrets at runtime)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'jurilab-app'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      # Non-sensitive runtime env vars
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=europe-west1'
      # Sensitive secrets — fetched from Secret Manager at container startup.
      # Create secrets once with: scripts/setup-gcp.sh
      - '--set-secrets'
      - 'DAILY_API_KEY=jurilab-daily-api-key:latest,PISTE_CLIENT_ID=jurilab-piste-client-id:latest,PISTE_CLIENT_SECRET=jurilab-piste-client-secret:latest'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/jurilab/jurilab-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY

# Substitution variables — set in Cloud Build trigger
substitutions:
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''
  _VITE_GOOGLE_CLIENT_ID: ''
  _VITE_GOOGLE_DEVELOPER_KEY: ''
  _VITE_GOOGLE_APP_ID: ''
  _VITE_STREAM_API_KEY: ''
  # Backend-only secrets come from Secret Manager via --set-secrets above.
